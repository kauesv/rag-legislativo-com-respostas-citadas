name: rag-legislativo

services:
  db:
    image: pgvector/pgvector:pg17
    env_file:
      - ./.env.db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    container_name: fastapi_app
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"

volumes:
  postgres_data:
